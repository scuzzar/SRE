<!doctype html>
<!--
  UI-Mock: Crew-Zuweisung (Entwurf zu Änderung 2026-11-22d, noch nicht freigegeben).
  Gedacht als dritter Reiter „Crew" im Reiter Schiff. Zugewiesen wird über das Blatt am Posten:
  Feld antippen, Charakter wählen – die Liste zeigt die Stufe auf diesem Posten, wer schon wo
  steht und wer damit auf zwei Posten käme. Ziehen gibt es nur zwischen den Posten: den Chip aus
  einem Feld in ein freies Feld ziehen zieht um, in ein besetztes Feld tauscht beide. Ziehen bis
  ins Feld „Ohne Posten" am Ende der Liste setzt ab. Bewusst ohne Erklärtexte: die Posten stehen
  als Liste, das Blatt regelt den Rest. Regeln wie im Entwurf des Domänenmodells: ein Charakter
  pro Posten, höchstens zwei Posten je Charakter über alle Schiffe (der Zug kann daran nichts
  ändern, nur das Blatt kann jemanden auf einen zweiten Posten setzen – dann zählt seine
  Fertigkeit auf beiden um 1 niedriger, SE 11); Mindeststufen nach SR 33 sind Hinweis, nicht
  Verbot (gelb markierte Werte liegen darunter); auf einem Small Craft gilt für den Piloten das
  bessere aus Ship's Boat und Pilot − 1 (SR 33). Daten sind Beispielwerte aus den
  Standardentwürfen (SE 10) und den Beispielcharakteren der App. Kein App-Code.
-->
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>UI-Mock · Crew zuweisen</title>
<style>
  /* Entlehnt src/view/styles.css, damit das Mock wie die App aussieht (Tokens dort). */
  :root {
    --bg: #08090d;
    --surface: #14161d;
    --surface-raised: #1b1e27;
    --overlay: rgba(8, 9, 13, 0.78);
    --line: #2b2f3b;
    --line-strong: #454b5c;
    --text: #eceae4;
    --text-muted: #9ba1b0;
    --accent: #e0a93c;
    --accent-soft: rgba(224, 169, 60, 0.14);
    --accent-wash: rgba(224, 169, 60, 0.06);
    --accent-text: #f4d79b;
    --success: #55b973;
    --danger: #e5544b;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
  body { display: flex; flex-direction: column; align-items: center; padding: 18px 12px 40px; }
  .app {
    position: relative; width: 100%; max-width: 430px; height: min(860px, 92vh);
    display: flex; flex-direction: column; background: var(--bg);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    font-size: 14px; line-height: 1.4; user-select: none;
  }

  .screen { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .ship-head { flex: 0 0 auto; padding: 12px 16px 8px; }
  .ship-head .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: .01em; }
  .ship-head .sub { font-size: 12px; color: var(--text-muted); letter-spacing: .04em; text-transform: uppercase; }
  .cred { font-family: var(--mono); color: var(--accent-text); font-size: 17px; }

  .ships { display: flex; gap: 8px; margin-top: 10px; }
  .ship-tile {
    flex: 1 1 0; min-width: 0; text-align: left; padding: 8px 10px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
    color: var(--text-muted); font: inherit; font-size: 11.5px;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .ship-tile b { display: block; font-size: 14px; color: var(--text); letter-spacing: 0; text-transform: none; font-weight: 600; }
  .ship-tile.on { border-color: var(--accent); background: var(--accent-wash); color: var(--accent-text); }
  .ship-tile.on b { color: var(--accent-text); }

  .tabs { flex: 0 0 auto; display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .tab {
    appearance: none; border: 0; background: none; padding: 10px 12px 9px; cursor: pointer;
    font: inherit; font-size: 14px; color: var(--text-muted); border-bottom: 2px solid transparent;
  }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tab:disabled { color: var(--line-strong); }

  .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 16px 16px; -webkit-overflow-scrolling: touch; }
  .section-title { margin: 16px 0 8px; font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }

  /* Posten: eine Karte pro besetzten Posten. Rechts die DM-Stufe, gelb unter der Mindeststufe. */
  .posts { display: flex; flex-direction: column; gap: 8px; }
  .post { display: flex; align-items: stretch; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
  .post > .main { flex: 1 1 auto; min-width: 0; }
  .post .name { font-size: 14.5px; font-weight: 600; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .post .name .tag { font-size: 11px; font-weight: 400; color: var(--text-muted); }
  .dm {
    flex: 0 0 auto; align-self: center; min-width: 58px; padding: 5px 8px; text-align: center;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
    font-family: var(--mono); font-size: 17px;
  }
  .dm small { display: block; font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); font-family: var(--sans); }
  .dm.low { color: var(--accent-text); border-color: var(--accent); }

  .field { min-height: 40px; margin-top: 4px; display: flex; align-items: center; }
  .post.ok { border-color: var(--accent); background: var(--accent-wash); }
  .post.swap { border-color: var(--success); background: rgba(85, 185, 115, 0.1); }

  /* Leere Posten sind eine schmale Zeile, ganz unten in der Liste. */
  .free { display: flex; flex-direction: column; gap: 6px; }
  .arow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; cursor: pointer; }
  .arow .name { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .arow .tag { font-size: 11.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arow .sp { flex: 1 1 auto; min-width: 6px; }
  .arow .min { font-size: 11.5px; color: var(--text-muted); }
  .arow .plus { color: var(--line-strong); font-size: 18px; line-height: 1; }
  .arow.ok { border-style: solid; border-color: var(--accent); background: var(--accent-wash); }
  .arow.blocked { opacity: .45; cursor: default; }

  .chip {
    display: inline-flex; align-items: center; gap: 7px; max-width: 100%; padding: 7px 10px 7px 8px;
    border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface-raised);
    cursor: grab; touch-action: none;
  }
  .chip .grip { color: var(--text-muted); font-size: 13px; letter-spacing: -2px; }
  .chip b { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .sk { font-family: var(--mono); font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .chip .nsc { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .chip .multi { font-family: var(--mono); font-size: 10.5px; color: var(--accent-text); }
  .ghost {
    position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none; display: none;
    box-shadow: 0 10px 24px rgba(0, 0, 0, .6); opacity: .96;
  }

  /* Immer da, damit beim Ziehen nichts unter dem Finger verrutscht; leuchtet während des Zuges. */
  .freezone { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; min-height: 44px; padding: 7px 9px; border: 1px dashed var(--line); border-radius: 8px; }
  .freezone .who { color: var(--text); padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--raised, var(--surface-raised)); font-size: 12px; }
  .freezone.armed { border-color: var(--line-strong); }
  .freezone.ok { border-color: var(--accent); border-style: solid; background: var(--accent-wash); }

  .dock { flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--surface); }
  .nav { display: flex; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { flex: 1 0 auto; appearance: none; border: 0; background: none; color: var(--text-muted); font: inherit; font-size: 12px; padding: 11px 10px 12px; cursor: pointer; border-top: 2px solid transparent; white-space: nowrap; }
  .nav button[aria-current="page"] { color: var(--text); border-top-color: var(--accent); }

  .toast {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 20;
    max-width: 88%; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 8px;
    background: var(--surface-raised); color: var(--accent-text); font-family: var(--mono); font-size: 12px;
    opacity: 0; transition: opacity .18s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .scrim { position: absolute; inset: 0; z-index: 30; display: none; background: var(--overlay); }
  .scrim.show { display: block; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; display: flex; flex-direction: column;
    max-height: 88%; background: var(--surface-raised); border-top: 1px solid var(--line-strong);
    border-radius: 14px 14px 0 0; padding: 10px 14px 14px; transform: translateY(102%);
    transition: transform .2s ease;
  }
  .sheet.show { transform: translateY(0); }
  .sheet .grab { width: 38px; height: 4px; border-radius: 999px; background: var(--line-strong); margin: 0 auto 10px; flex: 0 0 auto; }
  .sheet-head { flex: 0 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .sheet-title { font-size: 17px; font-weight: 600; }
  .sheet-src { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); text-align: right; }
  .sheet-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .pick { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
  .pick + .pick { margin-top: 6px; }
  .pick .who { flex: 1 1 auto; min-width: 0; }
  .pick b { font-weight: 600; }
  .pick .bg { font-size: 11.5px; color: var(--text-muted); }
  .pick .warn { font-size: 11px; color: var(--accent-text); }
  .pick .warn.low { color: var(--danger); }
  .pick .val { flex: 0 0 auto; font-family: var(--mono); font-size: 16px; text-align: right; }
  .pick .val small { display: block; font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); font-family: var(--sans); }
  .pick .val.low { color: var(--accent-text); }
  .sheet-foot { flex: 0 0 auto; display: flex; gap: 8px; padding-top: 12px; }
  .btn { flex: 1 1 0; appearance: none; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 14px; padding: 11px 12px; cursor: pointer; }
  .btn.danger { border-color: var(--danger); color: var(--danger); }

  .card { padding: 12px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  .card p { margin: 0; font-size: 13px; color: var(--text-muted); }

  .mock-note { max-width: 430px; margin: 14px 0 0; color: var(--text-muted); font-size: 11.5px; }
</style>
</head>
<body>
  <div class="app" id="app">
    <section class="screen" id="screen">
      <div class="ship-head" id="shipHead"></div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <section class="scroll" id="scroll"></section>
      <div class="dock" id="dock"></div>
    </section>

    <div class="toast" id="toast"></div>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    <div class="ghost" id="ghost"></div>
  </div>

  <p class="mock-note">UI-Mock, kein App-Code · dritter Reiter <b>Crew</b> im Reiter Schiff · Entwurf zu Änderung 2026-11-22d.</p>

<script>
(() => {
  'use strict';

  // ── Daten ────────────────────────────────────────────────────────────────
  // Posten nach SR 33: Pilot, Navigator, Engineer, Steward, Medic; Gunner je Geschützturm.
  // Mindeststufen (Spalte „Stufe" auf SR 33) sind Hinweis, nie Verbot.
  // Quellen: docs/regeln-schiffe.md · src/data/ships.json · src/data/examples.json
  const ROLE_SKILL = {
    pilot: 'pilot', navigator: 'navigator', engineer: 'engineering',
    steward: 'steward', medic: 'medicskill', gunner: 'gunnery',
  };
  const ROLES = [
    { role: 'pilot', label: 'Pilot', sys: 'Pilot Controls', min: 1 },
    { role: 'navigator', label: 'Navigator', sys: 'Navigation System', min: 1 },
    { role: 'engineer', label: 'Engineer', sys: 'Power Plant', min: 1 },
    { role: 'steward', label: 'Steward', sys: 'Staterooms', min: 0 },
    { role: 'medic', label: 'Medic', sys: 'Medical Bay', min: 1 },
  ];
  const GUNNER = { role: 'gunner', label: 'Gunner', sys: 'Fire Control', min: 1 };
  // Reihenfolge in der Liste: erst Pilot, dann die Gunner, dann der Rest.
  const ORDER = ['pilot', 'gunner', 'navigator', 'engineer', 'steward', 'medic'];
  // Small Craft: nur ein Pilot, ohne Pilot Controls, Pilot-Wert aus Ship's Boat oder Pilot − 1.
  const SMALL_ROLES = [{ role: 'pilot', label: 'Pilot', sys: null, tag: "Ship's Boat · Pilot − 1", min: 0 }];

  // Ein Posten kann auf einer Anlage hängen, die das Schiff nicht hat. Dann ist er
  // nicht besetzbar; auf dem Small Craft ist der Pilot auch ohne Pilot Controls besetzbar.
  const hasSystem = (ship, p) =>
    (p.sys === null) || (ship.smallCraft && p.role === 'pilot') || (ship.systems || []).includes(p.sys);
  const postList = (ship) => ship.smallCraft
    ? SMALL_ROLES
    : ORDER.flatMap((r) => ROLES.concat(Array.from({ length: ship.turrets }, (_, i) => ({ ...GUNNER, turret: i })))
        .filter((p) => p.role === r));

  const chars = [
    { id: 'kira', name: 'Kira Vant', kind: 'SC', bg: 'Ex-Scout', skills: { pilot: 2, navigator: 1, engineering: 0, steward: 0, gunnery: 0, medicskill: 0 } },
    { id: 'jonas', name: 'Jonas Reyl', kind: 'SC', bg: 'Ex-Merchant', skills: { pilot: 1, navigator: 0, engineering: 1, steward: 1, gunnery: 0, medicskill: 0, boats: 1 } },
    { id: 'marta', name: 'Marta Kesh', kind: 'NSC', bg: '', skills: { pilot: 0, navigator: 2, engineering: 0, steward: 0, gunnery: 0, medicskill: 0 } },
    { id: 'dok', name: 'Dr. Halvek', kind: 'NSC', bg: 'Schiffsarzt', skills: { pilot: 0, navigator: 0, engineering: 0, steward: 1, gunnery: 0, medicskill: 2 } },
    { id: 'bram', name: 'Bram Tol', kind: 'NSC', bg: 'Heuer, ex-Militär', skills: { pilot: 1, navigator: 0, engineering: 1, steward: 0, gunnery: 2, medicskill: 0 } },
    { id: 'ildi', name: 'Ildi Sarn', kind: 'NSC', bg: 'Heuer', skills: { pilot: 0, navigator: 1, engineering: 0, steward: 2, gunnery: 0, medicskill: 0 } },
  ];

  const ships = [
    { id: 'schiff', name: 'Kessra Runner', klass: 'Free Trader', ton: '200 t', model: 'Modell 1/1',
      systems: ['Pilot Controls', 'Navigation System', 'Power Plant', 'Fire Control', 'Medical Bay', 'Staterooms', 'Bridge', 'Computer/1', 'Sensors'],
      computer: 1, smallCraft: false, turrets: 2, crewNeed: 7 },
    { id: 'boot', name: 'Beiboot 1', klass: "Ship's Boat", ton: '15 t', model: 'kein Rechner',
      systems: [], computer: 0, smallCraft: true, turrets: 0, crewNeed: 1 },
  ];

  // posts['schiff:pilot'] = CharakterId
  let posts = {};
  let shipId = 'schiff';
  let tab = 'crew';
  let sheet = null;

  const byId = (id) => chars.find((c) => c.id === id) || null;
  const ship = () => ships.find((s) => s.id === shipId);
  const postName = (ship, p) => (p.turret === undefined ? p.label : `${p.label} · Turret ${p.turret + 1}`);
  const key = (s, p) => (p.turret === undefined ? `${s}:${p.role}` : `${s}:${p.role}#${p.turret}`);
  const countOf = (id) => Object.values(posts).filter((x) => x === id).length;
  const skillKey = (p) => ROLE_SKILL[p.role];
  const rawSkill = (c, p) => {
    if (!c) return 0;
    const s = ship();
    // Small Craft: Pilot zählt das bessere aus Ship's Boat und Pilot − 1 (SR 33).
    if (s.smallCraft && p.role === 'pilot') return Math.max(c.skills.boats || 0, (c.skills.pilot || 0) - 1);
    return c.skills[skillKey(p)] || 0;
  };
  const skillOn = (c, p) => Math.max(-3, rawSkill(c, p) - (countOf(c.id) >= 2 ? 1 : 0));
  const skillPreview = (c, p, targetKey) =>
    Math.max(-3, rawSkill(c, p) - (countOf(c.id) + (posts[targetKey] === c.id ? 0 : 1) >= 2 ? 1 : 0));

  // ── Bausteine ────────────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const scroll = $('scroll');
  const dock = $('dock');
  const toastEl = $('toast');
  const scrim = $('scrim');
  const sheetEl = $('sheet');
  const ghost = $('ghost');
  const app = $('app');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  function skillBadges(c) {
    const b = [];
    if (c.skills.pilot) b.push('P' + c.skills.pilot);
    if (c.skills.navigator) b.push('N' + c.skills.navigator);
    if (c.skills.engineering) b.push('E' + c.skills.engineering);
    if (c.skills.steward) b.push('S' + c.skills.steward);
    if (c.skills.gunnery) b.push('G' + c.skills.gunnery);
    if (c.skills.medicskill) b.push('M' + c.skills.medicskill);
    if (c.skills.boats) b.push("B" + c.skills.boats);
    return b.join(' ');
  }

  function chipHtml(c) {
    if (!c) return '';
    const n = countOf(c.id);
    return `<span class="chip" draggable="false">
      <span class="grip">⋮⋮</span><b>${esc(c.name)}</b>
      <span class="sk">${esc(skillBadges(c))}</span>
      ${n >= 2 ? '<span class="multi">2</span>' : ''}
      ${c.kind === 'NSC' ? '<span class="nsc">NSC</span>' : ''}
    </span>`;
  }

  // ── Zeichnen ─────────────────────────────────────────────────────────────
  function render() {
    const s = ship();
    const filled = postList(s).filter((p) => posts[key(s.id, p)]).length;

    $('shipHead').innerHTML = `
      <div class="row"><h1>${esc(s.name)}</h1><span class="cred">Cr 8,62&nbsp;Mio</span></div>
      <div class="sub">${esc(s.klass)} &middot; ${esc(s.ton)} &middot; ${esc(s.model)}</div>
      <div class="ships">
        ${ships.map((x) => `<button class="ship-tile ${x.id === shipId ? 'on' : ''}" data-ship="${x.id}">
            ${esc(x.klass)}<b>${esc(x.name)} &middot; ${postList(x).filter((p) => posts[key(x.id, p)]).length}/${x.crewNeed}</b>
          </button>`).join('')}
      </div>`;

    $('tabs').innerHTML = ['deck', 'details', 'crew'].map((t) =>
      `<button class="tab" role="tab" data-tab="${t}" aria-selected="${t === tab}" ${t === 'deck' ? 'disabled' : ''}>${t === 'crew' ? 'Crew' : t === 'deck' ? 'Deckplan' : 'Details'}</button>`).join('');

    if (tab === 'details') {
      scroll.innerHTML = `<div class="card"><h3>Rumpf</h3><p>Duplikat der echten App. Der neue Reiter ist <b>Crew</b>.</p></div>`;
    } else {
      const all = postList(s);
      // Karte für einen besetzten Posten, schmale Zeile für einen freien.
      const row = (p) => {
        const k = key(s.id, p);
        const c = byId(posts[k]);
        const low = rawSkill(c, p) < p.min;
        return `<div class="post" data-drop="1" data-post="${k}">
          <div class="main">
            <div class="name">${esc(postName(s, p))} <span class="tag">${esc(p.tag || p.sys || '')}</span></div>
            <div class="field">${chipHtml(c)}</div>
          </div>
          <div class="dm ${low ? 'low' : ''}">${skillOn(c, p)}<small>DM-Stufe</small></div>
        </div>`;
      };
      const arow = (p, ohneAnlage) => `<div class="arow ${ohneAnlage ? 'blocked' : ''}" ${ohneAnlage ? '' : `data-drop="1" data-post="${key(s.id, p)}"`}>
          <span class="name">${esc(postName(s, p))}</span>
          <span class="tag">${esc(ohneAnlage ? p.sys + ' fehlt' : (p.tag || p.sys || ''))}</span>
          <span class="sp"></span>
          ${ohneAnlage ? '' : `<span class="min">${p.min > 0 ? 'ab ' + p.min : ''}</span><span class="plus">+</span>`}
        </div>`;
      const besetzt = all.filter((x) => posts[key(s.id, x)]);
      const frei = all.filter((x) => !posts[key(s.id, x)] && hasSystem(s, x));
      const defekt = all.filter((x) => !hasSystem(s, x));
      const idle = chars.filter((c) => countOf(c.id) === 0);
      // Erst, wer steht, dann wer frei ist, dann die leeren Posten.
      scroll.innerHTML = `
        ${besetzt.length ? `<div class="posts">${besetzt.map(row).join('')}</div>` : ''}
        <h2 class="section-title">Ohne Posten · <span>${idle.length}</span></h2>
        <div class="freezone" data-drop="1" data-free="1"${idle.length ? '' : ' style="min-height:34px"'}>
          ${idle.map((c) => `<span class="who">${esc(c.name)}</span>`).join('')}
        </div>
        ${frei.length || defekt.length ? `<h2 class="section-title">Freie Posten · <span>${frei.length}</span></h2>
        <div class="free">${frei.map((x) => arow(x, false)).join('')}${defekt.map((x) => arow(x, true)).join('')}</div>` : ''}`;
    }

    dock.innerHTML = `<nav class="nav">${['Log', 'Begegnung', 'Kampf', 'Shop', 'Schiff', 'Charaktere', 'NSC']
      .map((n) => `<button ${n === 'Schiff' ? 'aria-current="page"' : ''}>${n}</button>`).join('')}</nav>`;
  }

  // ── Blatt am Posten ──────────────────────────────────────────────────────
  // Ein Blatt, drei Funktionen: zuweisen, tauschend anderweitig zuteilen, absetzen.
  function openPostSheet(postKey) {
    const [sid, rest] = postKey.split(':');
    const s = ships.find((x) => x.id === sid);
    const [role, turret] = rest.split('#');
    const p = postList(s).find((x) => x.role === role && String(x.turret ?? '') === (turret ?? ''));
    if (!p) return;
    const here = byId(posts[postKey]);

    const wählbar = chars.filter((c) => c.id !== here?.id && countOf(c.id) <= 1).map((c) => {
      const v = skillPreview(c, p, postKey);
      const low = rawSkill(c, p) < p.min;
      return `<button class="pick" data-assign="${c.id}">
          <span class="who"><b>${esc(c.name)}</b>
            <span class="bg">${esc((c.kind === 'NSC' ? 'NSC ' : 'SC ') + (c.bg ? c.bg + ' · ' : ''))}${esc(skillBadges(c))}</span>
            ${countOf(c.id) === 1 ? `<span class="warn"> · zweiter Posten −1</span>` : ''}
          </span>
          <span class="val ${low ? 'low' : ''}">${v}<small>DM-Stufe</small></span>
        </button>`;
    }).join('');

    const wohin = here ? postList(s).filter((q) => key(s.id, q) !== postKey).map((q) => {
      const k = key(s.id, q);
      const other = byId(posts[k]);
      const v = skillPreview(here, q, k);
      return `<button class="pick" data-move="${k}">
          <span class="who"><b>${esc(postName(s, q))}</b>
            <span class="bg">${other ? esc(other.name) + ' tauscht' : 'frei · hinziehen'}</span></span>
          <span class="val ${rawSkill(here, q) < q.min ? 'low' : ''}">${v}<small>DM-Stufe</small></span>
        </button>`;
    }).join('') : '';

    sheet = { postKey };
    sheetEl.innerHTML = `
      <div class="grab"></div>
      <div class="sheet-head"><span class="sheet-title">${esc(postName(s, p))} · ${esc(s.name)}</span>
        <span class="sheet-src">${p.min > 0 ? 'ab Stufe ' + p.min : ''}</span></div>
      <div class="sheet-scroll">
        <section>
          <h2 class="section-title" style="margin-top:0">${here ? 'Stattdessen hierher' : 'Zuweisen'}</h2>
          ${wählbar || '<p style="font-size:12.5px;color:var(--text-muted);margin:0">niemand ohne zwei Posten</p>'}
        </section>
        ${here ? `<section><h2 class="section-title" style="margin-top:0">Umziehen / tauschen</h2>${wohin}</section>` : ''}
      </div>
      <div class="sheet-foot">
        ${here ? `<button class="btn danger" data-unassign="1">${esc(here.name)} absetzen</button>` : ''}
        <button class="btn" data-close="1">Zurück</button>
      </div>`;
    openSheet();
  }

  function openSheet() { scrim.classList.add('show'); sheetEl.classList.add('show'); }
  function closeSheet() { sheet = null; scrim.classList.remove('show'); sheetEl.classList.remove('show'); }

  function assign(charId, postKey) {
    const c = byId(charId);
    if (!c) return;
    if (posts[postKey] === charId) return;
    posts[postKey] = charId;
    const s = ships.find((x) => x.id === postKey.split(':')[0]);
    toast(`${c.name} → ${postName(s, postOf(postKey))}`);
    render();
  }

  // Ziehen und das Blatt bewegen beide nur eine Person von einem Posten auf einen
  // anderen. Deshalb kann dabei die Zahl der Posten je Person nie ändern.
  function moveTo(fromKey, toKey) {
    const a = byId(posts[fromKey]);
    const b = byId(posts[toKey]);
    if (!a || fromKey === toKey) { render(); return; }
    delete posts[fromKey];
    posts[toKey] = a.id;
    if (b) posts[fromKey] = b.id;
    const s = ships.find((x) => x.id === fromKey.split(':')[0]);
    const vn = (c, k) => `${skillOn(c, postOf(k))}`;
    toast(b
      ? `${a.name} → ${postName(s, postOf(toKey))} (${vn(a, toKey)}), ${b.name} → ${postName(s, postOf(fromKey))} (${vn(b, fromKey)})`
      : `${a.name} → ${postName(s, postOf(toKey))} (${vn(a, toKey)})`);
    render();
  }

  function unassign(postKey) {
    const c = byId(posts[postKey]);
    if (c) delete posts[postKey];
    render();
    if (c) toast(`${c.name} abgesetzt`);
  }

  // ── Ziehen ───────────────────────────────────────────────────────────────
  // Nur von einem Posten aus. Freies Feld = umziehen, besetztes = tauschen,
  // „Ohne Posten" = absetzen. Die Schwelle von 10 px unterscheidet Zug und Tipp.
  let drag = null;

  function postOf(k) {
    const [sid, rest] = k.split(':');
    const [role, turret] = rest.split('#');
    return postList(ships.find((s) => s.id === sid)).find((x) => x.role === role && String(x.turret ?? '') === (turret ?? ''));
  }
  // Nach einem Zug schickt der Browser noch einen Klick auf das Feld unter dem Finger. Der
  // gehört zum Zug und darf kein Blatt öffnen – darum ein kurzes Zeitfenster statt eines
  // Zeitgebers (der lief dem Klick davon).
  let suppressUntil = 0;

  function clearMarks() {
    document.querySelectorAll('.post.ok, .post.swap, .arow.ok').forEach((el) => el.classList.remove('ok', 'swap'));
    document.querySelectorAll('.freezone.ok').forEach((el) => el.classList.remove('ok'));
  }
  const armFree = (on) => document.querySelectorAll('.freezone').forEach((el) => el.classList.toggle('armed', on));
  function underPointer(x, y) {
    return document.elementsFromPoint(x, y)
      .find((el) => el !== ghost && !ghost.contains(el) && el.closest('[data-drop]'))
      ?.closest('[data-drop]') || null;
  }
  function autoScroll(y) {
    const r = scroll.getBoundingClientRect();
    if (y < r.top + 46) scroll.scrollTop -= 12;
    else if (y > r.bottom - 46) scroll.scrollTop += 12;
  }

  app.addEventListener('pointerdown', (ev) => {
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    const chip = ev.target.closest('.chip');
    const postEl = ev.target.closest('[data-post]');
    if (!chip || !postEl) return;
    drag = { id: posts[postEl.dataset.post], from: postEl.dataset.post, el: chip,
             x0: ev.clientX, y0: ev.clientY, ghost: false };
  });

  window.addEventListener('pointermove', (ev) => {
    if (!drag) return;
    const dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
    if (!drag.ghost) {
      if (Math.hypot(dx, dy) < 10) return;
      ev.preventDefault();
      const r = drag.el.getBoundingClientRect();
      drag.ox = drag.x0 - r.left; drag.oy = drag.y0 - r.top;
      ghost.style.width = r.width + 'px';
      ghost.innerHTML = chipHtml(byId(drag.id));
      ghost.style.display = 'block';
      armFree(true);
      drag.el.style.opacity = '0.35';
      drag.ghost = true;
    }
    ghost.style.transform = `translate(${ev.clientX - drag.ox}px, ${ev.clientY - drag.oy}px)`;
    clearMarks();
    const over = underPointer(ev.clientX, ev.clientY);
    if (!over) { autoScroll(ev.clientY); return; }
    if (over.dataset.free) { over.classList.add('ok'); return; }
    const target = over.dataset.post;
    if (target === drag.from) return;
    over.classList.add(posts[target] ? 'swap' : 'ok');
  }, { passive: false });

  window.addEventListener('pointerup', (ev) => {
    if (!drag) return;
    const d = drag; drag = null;
    clearMarks();
    if (d.ghost) {
      suppressUntil = Date.now() + 400;
      // Erst das Ziel ablesen, dann aufräumen.
      const over = underPointer(ev.clientX, ev.clientY);
      ghost.style.display = 'none';
      ghost.innerHTML = '';
      d.el.style.opacity = '';
      armFree(false);
      if (!over) { render(); return; }
      if (over.dataset.free) { unassign(d.from); return; }
      moveTo(d.from, over.dataset.post);
      return;
    }
    // Kein Zug, also ein Tipp. Hier nicht neu zeichnen: das würde das Feld unter dem Klick
    // austauschen und der Klick ins Leere schicken.
  });
  window.addEventListener('pointercancel', () => {
    if (!drag) return;
    if (drag.ghost) {
      ghost.style.display = 'none';
      ghost.innerHTML = '';
      drag.el.style.opacity = '';
      armFree(false);
    }
    drag = null;
    render();
  });

  app.addEventListener('click', (ev) => {
    const shipBtn = ev.target.closest('[data-ship]');
    if (shipBtn) { shipId = shipBtn.dataset.ship; render(); return; }
    const tabBtn = ev.target.closest('[data-tab]');
    if (tabBtn && !tabBtn.disabled) { tab = tabBtn.dataset.tab; render(); return; }
    if (Date.now() < suppressUntil) return;
    if (ev.target.closest('[data-close]')) { closeSheet(); return; }
    if (ev.target === scrim || ev.target.closest('.grab')) { closeSheet(); return; }
    if (ev.target.closest('[data-unassign]')) {
      if (sheet) unassign(sheet.postKey);
      closeSheet();
      return;
    }
    if (sheet) {
      const a = ev.target.closest('[data-assign]');
      if (a) { assign(a.dataset.assign, sheet.postKey); closeSheet(); return; }
      const m = ev.target.closest('[data-move]');
      if (m) { moveTo(sheet.postKey, m.dataset.move); closeSheet(); return; }
      return;
    }
    const postEl = ev.target.closest('[data-post]');
    if (postEl) openPostSheet(postEl.dataset.post);
  });

  render();
})();
</script>
</body>
</html>
