<script>
// Gewichte wie im Domänenmodell (Wurffelder der Karte).
const BELL = [1, 6, 16, 30, 47, 47, 30, 16, 6, 1];
const SCATTER = ['n', 'ne', 'e', 'se', 's', 'sw', 'w', 'nw', 'hit', 'miss'];
const SCATTER_TEXT = { n: 'N', ne: 'NO', e: 'O', se: 'SO', s: 'S', sw: 'SW', w: 'W', nw: 'NW', hit: 'Volltreffer', miss: 'Fehlschlag' };
const KINDS = ['none', 'path', 'deadEnd', 'hidden', 'obstacle'];
const KIND_TEXT = { none: 'kein Weg', path: 'Weg', deadEnd: 'Sackgasse', hidden: 'verborgen', obstacle: 'Hindernis' };
const FLAT = [7, 7, 2, 2, 2];
const VERTICAL = [15, 2, 1, 1, 1];
const DIRS = ['north', 'east', 'south', 'west', 'up', 'down'];
const DIR_TEXT = { north: 'N', east: 'O', south: 'S', west: 'W', up: '↑', down: '↓' };

const weighted = (weights) => {
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r < 0) return i; }
  return weights.length - 1;
};
const rollMap = () => {
  for (;;) {
    const map = {};
    for (const d of DIRS) map[d] = KINDS[weighted(d === 'up' || d === 'down' ? VERTICAL : FLAT)];
    if (DIRS.filter((d) => map[d] !== 'none').length >= 2) return map;

// Windrose: acht Striche mit Buchstaben, der Pfeil in Gold; Volltreffer als Stern, Fehlschlag als Strich.
function roseSvg(value, small) {
  const parts = [];

  parts.push('<circle cx="50" cy="50" r="38" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>');
  for (const [k, a] of Object.entries(angle)) {
    const rad = (a - 90) * Math.PI / 180;
    const main = a % 90 === 0;
    const x1 = 50 + Math.cos(rad) * (main ? 30 : 33), y1 = 50 + Math.sin(rad) * (main ? 30 : 33);
    const x2 = 50 + Math.cos(rad) * 38, y2 = 50 + Math.sin(rad) * 38;
    parts.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${value === k ? 'currentColor' : '#555'}" stroke-width="${main ? 2 : 1.3}"/>`);
    if (!small && main) {
      const tx = 50 + Math.cos(rad) * 47, ty = 50 + Math.sin(rad) * 47 + 3.5;
      parts.push(`<text x="${tx}" y="${ty}" font-size="10" font-family="IBM Plex Sans, sans-serif" font-weight="600" text-anchor="middle" fill="${value === k ? '#f5dc96' : '#8c8a85'}">${SCATTER_TEXT[k]}</text>`);
    }
  }

    parts.push(`<g transform="rotate(${angle[value]} 50 50)"><path d="M50 18 L58 34 L52.5 32 L52.5 62 L47.5 62 L47.5 32 L42 34 Z" fill="currentColor"/><circle cx="50" cy="62" r="4" fill="#8a6a2a"/></g>`);

    parts.push(`<polygon points="${pts.join(' ')}" fill="currentColor"/>`);
  } else {
    parts.push('<line x1="34" y1="50" x2="66" y2="50" stroke="#ef5a5f" stroke-width="5" stroke-linecap="round"/>');

// Ein Weg von (x1,y1) nach außen in Richtung (dx,dy), je nach Wegart.
function pathSvg(kind, x1, y1, dx, dy, len) {

  switch (kind) {
    case 'path': return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${s}/>`;
    case 'deadEnd': { const [a, b] = end(len * 0.42); return `<line x1="${x1}" y1="${y1}" x2="${a}" y2="${b}" ${s}/><line x1="${a - dy * 6}" y1="${b - dx * 6}" x2="${a + dy * 6}" y2="${b + dx * 6}" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>`; }

// Kartensymbol: ein Raum von oben, Wege nach N, O, S, W; oben und unten als Pfeile im Raum.
function mapSvg(map) {

  parts.push(pathSvg(map.south, 50, 70, 0, 1, 26));
  parts.push(pathSvg(map.east, 70, 50, 1, 0, 26));
  parts.push(pathSvg(map.west, 30, 50, -1, 0, 26));

    if (kind === 'none') return '';
    const y1 = up ? 62 : 38, y2 = up ? 38 : 62;

      case 'obstacle': return shaft('') + headSvg + `<line x1="${x - 7}" y1="50" x2="${x + 7}" y2="50" stroke="#ef5a5f" stroke-width="3" stroke-linecap="round"/>`;

  const max = Math.max(...BELL);

const NAME_KINDS = [['female', 'Weiblich'], ['male', 'Männlich'], ['neutral', 'Neutral']];
const drawNames = () => ['earth', 'space'].flatMap((sound) => NAME_KINDS.map(([k, label]) => ({ label: `${label}, ${sound === 'earth' ? 'irdisch' : 'spacig'}`, sound, text: `${pickOne(NAMES[k][sound])} ${pickOne(NAMES.surnames[sound])}` })));

}
function count() {
  const n = document.querySelectorAll('.card-sheet .tile[aria-pressed=true]').length;
  document.querySelector('.sheet-foot .count').textContent = n ? `${n} ausgewählt` : 'Nichts ausgewählt';
  const c = document.querySelector('.sheet-foot .confirm'); c.disabled = n === 0;
}
document.querySelector('.card-sheet').addEventListener('click', (e) => {
  const t = e.target.closest('.tile'); if (!t) return;
  t.setAttribute('aria-pressed', t.getAttribute('aria-pressed') !== 'true'); count();
});
[...document.querySelectorAll('.sheet-foot button')].find((b) => b.textContent.includes('Neu ziehen')).addEventListener('click', deal);
deal();
</script>
</body>
</html>
