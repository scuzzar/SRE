<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="Solo-Rollenspiel mit Classic Traveller: Orakel, Inspirationskarte und Proben" />
    <title>Solo RPG Engine</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Solo RPG" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap"
    />
    <script>
      // Lädt das Skript der App nicht (etwa eine alte Seite nach einem Update, deren Skript es nicht
      // mehr gibt), lädt die Seite einmal neu, statt weiß zu bleiben; einmal je Sitzung, nie im Kreis.
      addEventListener(
        'error',
        function (event) {
          var el = event.target;
          if (!el || el.tagName !== 'SCRIPT' || el.type !== 'module') return;
          try {
            if (sessionStorage.getItem('sre-reloaded')) return;
            sessionStorage.setItem('sre-reloaded', '1');
          } catch (e) {
            return;
          }
          location.reload();
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
