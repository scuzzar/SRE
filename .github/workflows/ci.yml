name: CI

on:
  push:
  pull_request:

# Geprüft wird, was schnell und verlässlich ist. Die Systemtests (Playwright) laufen nach jeder
# Änderung lokal (`npm run test:e2e`, so steht es in AGENTS.md) und bleiben darum hier heraus: auf
# dem Runner brauchen sie über zehn Minuten und fallen um, ohne dass die App etwas kann – zwei
# Chromiums auf zwei Kernen, die App als ein Bundle, 64 MB geteilter Speicher. Mehr Zeit und
# `--disable-dev-shm-usage` haben es gebessert, zuverlässig nicht. Der alte Job steht im
# Git-Verlauf (vor `Playwright aus dem Push-CI genommen`).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
